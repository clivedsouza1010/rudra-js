name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job only reads the repository. Nothing here needs write access.
permissions:
  contents: read

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit: a tag is a mutable ref, and this workflow
      # runs on every pull request. actions/checkout also leaves its token in
      # .git/config by default, so do not persist it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TypeScript 7 and Vitest 4 both require Node ^20.19 || >=22.12.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Some dependencies in the tree do carry an install script (esbuild's
      # postinstall sets up its binary, and it is not darwin-only), but none
      # of them need to run for this workspace to build and test, so do not
      # run arbitrary code from the dependency graph on every CI run.
      - run: npm ci --ignore-scripts

      # Build first: the workspace packages resolve each other through their
      # generated `dist/`, which `npm ci` does not produce.
      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # Asserts what a tarball contains; this asserts that the tarball works —
      # it packs both packages, resolves them from outside the repository, and
      # renders. Nothing else here would notice a package that installs but
      # cannot be imported.
      - run: npm run verify:consumer

  # A separate job so the fast checks above stay fast: a Next.js build is
  # slower than everything else in `verify` put together.
  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      # No ANTHROPIC_API_KEY here: the shop replays, and a replay miss is an
      # error in CI rather than a quiet fallback.
      - run: npm run build --workspace @rudra-js/example-shop
      - run: npm run typecheck --workspace @rudra-js/example-shop
