name: Measure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      # No ANTHROPIC_API_KEY here: the shop replays, and a replay miss is an
      # error in CI rather than a quiet fallback.
      - run: npm run build --workspace @rudra-js/example-shop

      - run: npm run matrix:crawler | tee "$RUNNER_TEMP/matrix.txt"
        shell: bash
      - run: npm run bench | tee "$RUNNER_TEMP/bench.txt"
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: measurements
          path: |
            ${{ runner.temp }}/matrix.txt
            ${{ runner.temp }}/bench.txt
