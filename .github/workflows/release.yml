name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the OIDC token npm uses to attest that this build produced this
      # package. Without it, --provenance fails rather than silently skipping.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A tag on any branch would otherwise publish with valid provenance. It has
      # to sit on main and name the version in package.json.
      - run: git fetch --no-tags origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      # Publishing an artefact nobody verified is how a broken release ships.
      # The same checks CI runs, in the same order — a release must not be
      # held to a lower standard than a pull request.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:consumer

      # Provenance links the published tarball to this commit, this workflow and
      # this runner, so a consumer can check where it came from. It requires a
      # public `repository` field in package.json matching this repo, which both
      # packages have.
      #
      # Core first: @rudra-js/react declares it as a peer, so a registry that has
      # the second without the first cannot satisfy an install.
      #
      # npm has no transactional multi-publish. If core succeeds and react then
      # fails, the tag cannot simply be re-run — npm rejects republishing a
      # version that exists, so the job would fail on core before reaching
      # react. Publishing by hand is not the way out either: the only credential
      # is the OIDC token this job mints, and there is no token to run npm
      # publish with from a laptop. Recover by bumping the version and tagging a
      # new patch release.

      # Node 22 ships npm 10. Trusted publishing needs 11.5, which reads the
      # OIDC token itself - no registry-url, no NODE_AUTH_TOKEN.
      - run: npm install -g npm@11.19.1
      - run: npm --version
      - run: npm publish --provenance --access public
        working-directory: packages/core

      - run: npm publish --provenance --access public
        working-directory: packages/react

      - run: npm publish --provenance --access public
        working-directory: packages/anthropic
