name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --no-tags origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - run: test "v$(node -p "require('./packages/core/package.json').version")" = "$GITHUB_REF_NAME"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:consumer

      - run: npm install -g npm@11.19.1
      - run: npm --version
      - run: npm publish --provenance --access public
        working-directory: packages/attested

      - run: npm publish --provenance --access public
        working-directory: packages/core

      - run: npm publish --provenance --access public
        working-directory: packages/react

      - run: npm publish --provenance --access public
        working-directory: packages/anthropic
