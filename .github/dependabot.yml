version: 2
updates:
  # Actions are pinned by SHA, which is what makes a tag's mutability harmless —
  # but a pinned SHA never picks up a security fix on its own. Dependabot is the
  # other half of that trade.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # CodeQL's init, analyze and upload-sarif have to move together, or the
      # scan fails until the last of them lands.
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # One pull request for the toolchain rather than five. These move together
      # and are only ever exercised by CI.
      dev-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
